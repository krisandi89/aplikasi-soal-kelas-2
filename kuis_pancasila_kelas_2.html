<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latihan Soal Pancasila - Aturan di Rumah & Sekolah</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Nunito', sans-serif;
            background-color: #fef2f2; /* Red background */
        }
        h1, h2, h3 {
            font-family: 'Fredoka', sans-serif;
        }
        .quiz-card {
            transition: all 0.3s ease;
            border-left: 5px solid transparent;
        }
        .quiz-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }
        .quiz-card.answered {
            border-left-color: #dc2626; /* Red-600 */
        }
        .option-container {
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .option-container:hover {
            background-color: #fee2e2;
        }
        .option-input:checked + .option-label {
            color: #991b1b;
            font-weight: bold;
        }
        .result-box {
            animation: slideIn 0.5s ease-out;
        }
        .question-svg {
            display: block;
            margin: 10px auto;
            max-width: 150px;
            height: auto;
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-red-50 min-h-screen pb-20">

    <!-- Header -->
    <header class="bg-red-600 text-white p-6 shadow-lg sticky top-0 z-50">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <div>
                <h1 class="text-2xl md:text-3xl font-bold">Latihan Soal Pancasila</h1>
                <p class="text-red-100 text-sm md:text-base">Bab 2: Pentingnya Mematuhi Aturan</p>
            </div>
            <div class="text-right hidden md:block">
                <p class="font-semibold">Kelas 2 SD</p>
                <p class="text-xs text-red-200">40 Soal</p>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-4xl mx-auto p-4 mt-6">
        <form id="quizForm" class="space-y-6">
            
            <!-- Container Soal -->
            <div id="questions-container"></div>

            <!-- Tombol Submit -->
            <div class="mt-10 mb-20 text-center">
                <button type="submit" class="bg-red-600 hover:bg-red-700 text-white font-bold py-4 px-10 rounded-full shadow-lg transform transition hover:scale-105 text-lg flex items-center justify-center mx-auto gap-2">
                    <span>✅ Selesai & Lihat Nilai</span>
                </button>
            </div>
        </form>
    </main>

    <!-- Modal Hasil -->
    <div id="resultModal" class="fixed inset-0 bg-black bg-opacity-50 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl max-w-2xl w-full max-h-[90vh] overflow-y-auto result-box">
            <div class="p-6 md:p-8">
                <div class="text-center mb-6">
                    <div class="inline-block p-4 rounded-full bg-red-100 mb-4">
                        <span class="text-4xl">🇮🇩</span>
                    </div>
                    <h2 class="text-3xl font-bold text-gray-800">Hasil Latihan</h2>
                    <p class="text-gray-600">Hebat! Kamu telah menyelesaikan latihan Pancasila.</p>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-8">
                    <div class="bg-blue-50 p-4 rounded-xl border border-blue-200 text-center">
                        <p class="text-sm text-blue-600 font-semibold uppercase tracking-wider">Skor Objektif</p>
                        <p id="finalScore" class="text-4xl font-bold text-blue-800">0</p>
                        <p class="text-xs text-blue-500 mt-1">(PG, Benar/Salah, Isian, PG Kompleks)</p>
                    </div>
                    <div class="bg-orange-50 p-4 rounded-xl border border-orange-200 text-center">
                        <p class="text-sm text-orange-600 font-semibold uppercase tracking-wider">Soal Uraian</p>
                        <p class="text-lg font-bold text-orange-800">Cek Manual</p>
                        <p class="text-xs text-orange-500 mt-1">(Minta orang tua/guru menilai)</p>
                    </div>
                </div>

                <!-- Rincian -->
                <div class="bg-gray-50 rounded-xl p-4 mb-6">
                    <h3 class="font-bold text-gray-700 mb-2">Rincian Jawaban:</h3>
                    <div id="resultDetails" class="space-y-2 text-sm text-gray-600 max-h-40 overflow-y-auto">
                        <!-- Detail will be injected here -->
                    </div>
                </div>

                <div class="flex flex-col md:flex-row gap-3 justify-center">
                    <button id="closeModalBtn" class="px-6 py-3 bg-gray-200 hover:bg-gray-300 text-gray-700 font-semibold rounded-lg transition">
                        Tutup & Lihat Pembahasan
                    </button>
                    <button onclick="location.reload()" class="px-6 py-3 bg-red-600 hover:bg-red-700 text-white font-semibold rounded-lg transition">
                        Ulangi Latihan
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Koleksi SVG Sederhana untuk Ilustrasi (Simbolik)
        const svgs = {
            rumah: `<svg class="question-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><path d="M10,40 L50,10 L90,40 V90 H10 Z" fill="#fca5a5" stroke="#b91c1c" stroke-width="2"/><rect x="40" y="60" width="20" height="30" fill="#7f1d1d"/><rect x="20" y="50" width="15" height="15" fill="#fef2f2" stroke="#b91c1c"/><rect x="65" y="50" width="15" height="15" fill="#fef2f2" stroke="#b91c1c"/></svg>`,
            jam: `<svg class="question-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><circle cx="50" cy="50" r="40" fill="#fff" stroke="#dc2626" stroke-width="3"/><path d="M50,50 L50,20" stroke="#dc2626" stroke-width="3" stroke-linecap="round"/><path d="M50,50 L70,50" stroke="#dc2626" stroke-width="3" stroke-linecap="round"/><circle cx="50" cy="50" r="3" fill="#dc2626"/></svg>`,
            seragam: `<svg class="question-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><path d="M30,20 L40,10 L60,10 L70,20 V60 H30 Z" fill="#fff" stroke="#b91c1c" stroke-width="2"/><path d="M30,60 H70 V90 H30 Z" fill="#ef4444" stroke="#b91c1c" stroke-width="2"/><path d="M50,20 V50" stroke="#b91c1c" stroke-width="1"/><polygon points="45,20 55,20 50,40" fill="#dc2626"/></svg>`,
            sekolah: `<svg class="question-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><rect x="10" y="40" width="80" height="50" fill="#fcd34d" stroke="#d97706"/><path d="M5,40 L50,10 L95,40" fill="#ef4444" stroke="#b91c1c"/><rect x="40" y="60" width="20" height="30" fill="#92400e"/><rect x="20" y="50" width="15" height="15" fill="#fff" stroke="#d97706"/><line x1="80" y1="90" x2="80" y2="20" stroke="#000" stroke-width="2"/><rect x="80" y="20" width="15" height="10" fill="#ef4444"/></svg>`
        };

        // Data Soal (40 Soal berdasarkan Kisi-kisi Pancasila)
        const questions = [
            // --- BAGIAN 1: PILIHAN GANDA (1-12) ---
            {
                id: 1, type: 'pg', question: "Aturan di rumah dan di sekolah dibuat agar hidup menjadi ...",
                options: ["Kacau", "Tertib", "Ramai", "Bebas"], answer: "Tertib",
                hint: "Tujuan utama aturan."
            },
            {
                id: 2, type: 'pg', question: "Aturan sekolah disebut juga dengan ...",
                options: ["Undang-undang", "Nasihat", "Tata tertib", "Perintah"], answer: "Tata tertib",
                svg: svgs.sekolah,
                hint: "Aturan resmi di sekolah."
            },
            {
                id: 3, type: 'pg', question: "Sikap mematuhi aturan di rumah contohnya adalah ...",
                options: ["Bangun kesiangan", "Merapikan tempat tidur", "Bermain tanpa izin", "Membiarkan mainan berantakan"], answer: "Merapikan tempat tidur",
                svg: svgs.rumah,
                hint: "Kegiatan pagi hari di kamar."
            },
            {
                id: 4, type: 'pg', question: "Sebelum pergi bermain, kita harus ... kepada orang tua.",
                options: ["Meminta uang", "Menangis", "Diam saja", "Meminta izin"], answer: "Meminta izin",
                hint: "Agar orang tua tidak khawatir."
            },
            {
                id: 5, type: 'pg', question: "Aturan saat berbicara dengan guru adalah menggunakan bahasa yang ...",
                options: ["Kasar", "Santun", "Keras", "Cepat"], answer: "Santun",
                hint: "Sopan dan hormat."
            },
            {
                id: 6, type: 'pg', question: "Akibat jika sering datang terlambat ke sekolah adalah ...",
                options: ["Dipuji guru", "Ketinggalan pelajaran", "Mendapat hadiah", "Disayang teman"], answer: "Ketinggalan pelajaran",
                svg: svgs.jam,
                hint: "Waktu belajar berkurang."
            },
            {
                id: 7, type: 'pg', question: "Jika melanggar aturan, kita akan mendapatkan ...",
                options: ["Hadiah", "Pujian", "Sanksi/Hukuman", "Nilai bagus"], answer: "Sanksi/Hukuman",
                hint: "Konsekuensi perbuatan buruk."
            },
            {
                id: 8, type: 'pg', question: "Berikut ini adalah perlengkapan seragam sekolah, kecuali ...",
                options: ["Topi", "Dasi", "Kalung mainan", "Ikat pinggang"], answer: "Kalung mainan",
                svg: svgs.seragam,
                hint: "Benda yang tidak boleh dipakai ke sekolah."
            },
            {
                id: 9, type: 'pg', question: "Aturan sebelum tidur malam adalah ...",
                options: ["Makan permen", "Bermain bola", "Menggosok gigi", "Berteriak"], answer: "Menggosok gigi",
                hint: "Menjaga kesehatan gigi."
            },
            {
                id: 10, type: 'pg', question: "Aturan di sekolah harus dipatuhi oleh ...",
                options: ["Guru saja", "Siswa saja", "Kepala sekolah saja", "Seluruh warga sekolah"], answer: "Seluruh warga sekolah",
                hint: "Semua orang di sekolah."
            },
            {
                id: 11, type: 'pg', question: "Saat upacara bendera, sikap kita harus ...",
                options: ["Mengobrol", "Tertib dan khidmat", "Bercanda", "Duduk santai"], answer: "Tertib dan khidmat",
                hint: "Menghormati bendera."
            },
            {
                id: 12, type: 'pg', question: "Contoh aturan tertulis di masyarakat adalah ...",
                options: ["Menghormati orang tua", "Rambu lalu lintas", "Menyapa tetangga", "Membantu teman"], answer: "Rambu lalu lintas",
                hint: "Ada tulisan atau gambarnya di jalan."
            },

            // --- BAGIAN 2: BENAR / SALAH (13-22) ---
            {
                id: 13, type: 'tf', question: "Aturan di rumah hanya berlaku untuk anak-anak saja.",
                options: ["Benar", "Salah"], answer: "Salah",
                hint: "Berlaku untuk semua anggota keluarga."
            },
            {
                id: 14, type: 'tf', question: "Merapikan sepatu di rak sepatu adalah aturan setelah pulang sekolah.",
                options: ["Benar", "Salah"], answer: "Benar",
                hint: "Agar rumah rapi."
            },
            {
                id: 15, type: 'tf', question: "Memakai seragam sekolah boleh sesuka hati, tidak perlu sesuai jadwal.",
                options: ["Benar", "Salah"], answer: "Salah",
                svg: svgs.seragam,
                hint: "Ada jadwal seragam (Senin-Selasa, dst)."
            },
            {
                id: 16, type: 'tf', question: "Jika ingin meminjam pensil teman, kita harus meminta izin terlebih dahulu.",
                options: ["Benar", "Salah"], answer: "Benar",
                hint: "Sopan santun meminjam."
            },
            {
                id: 17, type: 'tf', question: "Bermain game sampai larut malam adalah contoh mematuhi aturan.",
                options: ["Benar", "Salah"], answer: "Salah",
                hint: "Itu melanggar aturan tidur malam."
            },
            {
                id: 18, type: 'tf', question: "Kita harus mengetuk pintu dan mengucapkan salam sebelum masuk rumah.",
                options: ["Benar", "Salah"], answer: "Benar",
                svg: svgs.rumah,
                hint: "Adab masuk rumah."
            },
            {
                id: 19, type: 'tf', question: "Melaksanakan piket kelas adalah kewajiban siswa.",
                options: ["Benar", "Salah"], answer: "Benar",
                hint: "Menjaga kebersihan kelas."
            },
            {
                id: 20, type: 'tf', question: "Berbicara kasar kepada teman diperbolehkan di sekolah.",
                options: ["Benar", "Salah"], answer: "Salah",
                hint: "Harus berbicara sopan."
            },
            {
                id: 21, type: 'tf', question: "Membantu ibu menyiapkan makan malam adalah aturan di sore/malam hari.",
                options: ["Benar", "Salah"], answer: "Benar",
                hint: "Sikap membantu orang tua."
            },
            {
                id: 22, type: 'tf', question: "Aturan dibuat untuk membuat kita susah.",
                options: ["Benar", "Salah"], answer: "Salah",
                hint: "Aturan dibuat untuk kebaikan bersama."
            },

            // --- BAGIAN 3: ISIAN SINGKAT (23-30) ---
            {
                id: 23, type: 'isian', question: "Aturan dapat berupa aturan tertulis dan ...",
                answer: "tidak tertulis", hint: "Lawan dari tertulis."
            },
            {
                id: 24, type: 'isian', question: "Aturan di sekolah disebut juga ...",
                answer: "tata tertib", svg: svgs.sekolah, hint: "Dua kata, berawalan T."
            },
            {
                id: 25, type: 'isian', question: "Jika berbuat salah, kita harus segera meminta ...",
                answer: "maaf", hint: "Sikap mengakui kesalahan."
            },
            {
                id: 26, type: 'isian', question: "Siswa yang melanggar aturan akan mendapatkan ...",
                answer: "sanksi", hint: "Atau hukuman."
            },
            {
                id: 27, type: 'isian', question: "Sebelum makan, kita harus ...",
                answer: "berdoa", hint: "Memohon berkah Tuhan."
            },
            {
                id: 28, type: 'isian', question: "Aturan di rumah harus dipatuhi oleh semua anggota ...",
                answer: "keluarga", svg: svgs.rumah, hint: "Ayah, Ibu, Anak."
            },
            {
                id: 29, type: 'isian', question: "Membuang sampah harus di ...",
                answer: "tempat sampah", hint: "Wadah sampah."
            },
            {
                id: 30, type: 'isian', question: "Jika guru sedang menjelaskan pelajaran, kita harus ...",
                answer: "mendengarkan", hint: "Memperhatikan dengan baik."
            },

            // --- BAGIAN 4: PILIHAN GANDA KOMPLEKS (31-35) ---
            {
                id: 31, type: 'pg_kompleks', question: "Pilih 2 aturan di PAGI hari:",
                options: ["Tidur siang", "Merapikan tempat tidur", "Mandi pagi", "Mengerjakan PR"], answer: ["Merapikan tempat tidur", "Mandi pagi"],
                hint: "Kegiatan setelah bangun tidur."
            },
            {
                id: 32, type: 'pg_kompleks', question: "Pilih 2 kelengkapan seragam sekolah:",
                options: ["Topi", "Mainan", "Dasi", "Sandal jepit"], answer: ["Topi", "Dasi"],
                svg: svgs.seragam,
                hint: "Atribut resmi."
            },
            {
                id: 33, type: 'pg_kompleks', question: "Pilih 2 sikap yang TIDAK boleh dilakukan di sekolah:",
                options: ["Berkelahi", "Belajar", "Mencontek", "Berdoa"], answer: ["Berkelahi", "Mencontek"],
                hint: "Perbuatan buruk."
            },
            {
                id: 34, type: 'pg_kompleks', question: "Pilih 2 manfaat mematuhi aturan:",
                options: ["Hidup menjadi tertib", "Sering dihukum", "Disayang orang tua", "Dijauhi teman"], answer: ["Hidup menjadi tertib", "Disayang orang tua"],
                hint: "Hal positif."
            },
            {
                id: 35, type: 'pg_kompleks', question: "Pilih 2 aturan saat pulang sekolah:",
                options: ["Melepas sepatu", "Langsung bermain", "Ganti baju", "Tidur pakai seragam"], answer: ["Melepas sepatu", "Ganti baju"],
                hint: "Kebersihan diri setelah sekolah."
            },

            // --- BAGIAN 5: URAIAN (36-40) ---
            {
                id: 36, type: 'uraian', question: "Sebutkan 3 contoh aturan di rumah pada malam hari!",
                answer: "Belajar/mengerjakan PR, makan malam bersama, menggosok gigi, berdoa sebelum tidur.", 
                hint: "Kegiatan sebelum tidur."
            },
            {
                id: 37, type: 'uraian', question: "Apa akibatnya jika kita tidak merapikan mainan setelah bermain?",
                answer: "Rumah menjadi berantakan, mainan bisa hilang/rusak, bisa terinjak orang lain.", 
                svg: svgs.rumah,
                hint: "Kondisi rumah jadi kacau."
            },
            {
                id: 38, type: 'uraian', question: "Tuliskan 3 atribut kelengkapan seragam sekolah!",
                answer: "Topi, Dasi, Ikat Pinggang, Kaos kaki putih, Sepatu hitam, Bet lokasi/nama.", 
                hint: "Aksesoris seragam."
            },
            {
                id: 39, type: 'uraian', question: "Mengapa kita harus meminta izin sebelum bermain keluar rumah?",
                answer: "Agar orang tua tidak khawatir, orang tua tahu keberadaan kita, dan menjaga keselamatan.", 
                hint: "Alasan keamanan."
            },
            {
                id: 40, type: 'uraian', question: "Bagaimana sikapmu jika melihat teman membuang sampah sembarangan di sekolah?",
                answer: "Menegurnya dengan sopan, mengajaknya membuang ke tempat sampah, atau memungutnya.", 
                hint: "Sikap peduli lingkungan."
            }
        ];

        // Render Questions
        const container = document.getElementById('questions-container');

        questions.forEach((q, index) => {
            const card = document.createElement('div');
            card.className = "quiz-card bg-white rounded-xl shadow-md p-6 border border-red-100 relative overflow-hidden";
            
            // Badge Tipe Soal
            let typeLabel = "";
            let typeColor = "bg-gray-200 text-gray-700";
            if(q.type === 'pg') { typeLabel = "Pilihan Ganda"; typeColor = "bg-blue-100 text-blue-700"; }
            if(q.type === 'tf') { typeLabel = "Benar / Salah"; typeColor = "bg-green-100 text-green-700"; }
            if(q.type === 'isian') { typeLabel = "Isian Singkat"; typeColor = "bg-yellow-100 text-yellow-700"; }
            if(q.type === 'pg_kompleks') { typeLabel = "Pilihan Ganda Kompleks"; typeColor = "bg-purple-100 text-purple-700"; }
            if(q.type === 'uraian') { typeLabel = "Uraian"; typeColor = "bg-orange-100 text-orange-700"; }

            let svgContent = q.svg ? `<div class="flex justify-center my-4">${q.svg}</div>` : '';

            let questionHTML = `
                <div class="flex justify-between items-start mb-4">
                    <div class="flex items-center gap-2">
                        <span class="flex items-center justify-center w-8 h-8 rounded-full bg-red-600 text-white font-bold">${index + 1}</span>
                        <span class="text-xs font-semibold px-2 py-1 rounded ${typeColor}">${typeLabel}</span>
                    </div>
                </div>
                <div class="mb-4">
                    ${svgContent}
                    <p class="text-lg text-gray-800 font-medium">${q.question}</p>
                    ${q.type === 'pg_kompleks' ? '<p class="text-xs text-purple-600 mt-1">*Pilih 2 jawaban yang benar</p>' : ''}
                </div>
            `;

            // Render Options based on Type
            let inputHTML = '';
            
            if (q.type === 'pg' || q.type === 'tf') {
                inputHTML += `<div class="space-y-3">`;
                q.options.forEach(opt => {
                    inputHTML += `
                        <label class="option-container flex items-center p-3 rounded-lg border border-gray-200 hover:border-red-400">
                            <input type="radio" name="q${q.id}" value="${opt}" class="option-input form-radio h-5 w-5 text-red-600 focus:ring-red-500">
                            <span class="option-label ml-3 text-gray-700">${opt}</span>
                        </label>
                    `;
                });
                inputHTML += `</div>`;
            } 
            else if (q.type === 'pg_kompleks') {
                inputHTML += `<div class="space-y-3">`;
                q.options.forEach(opt => {
                    inputHTML += `
                        <label class="option-container flex items-center p-3 rounded-lg border border-gray-200 hover:border-red-400">
                            <input type="checkbox" name="q${q.id}" value="${opt}" class="option-input form-checkbox h-5 w-5 text-red-600 focus:ring-red-500 rounded">
                            <span class="option-label ml-3 text-gray-700">${opt}</span>
                        </label>
                    `;
                });
                inputHTML += `</div>`;
            }
            else if (q.type === 'isian') {
                inputHTML += `
                    <input type="text" name="q${q.id}" placeholder="Ketik jawaban singkat..." class="w-full p-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent bg-gray-50">
                `;
            }
            else if (q.type === 'uraian') {
                inputHTML += `
                    <textarea name="q${q.id}" rows="3" placeholder="Tulis jawaban lengkapmu di sini..." class="w-full p-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent bg-gray-50"></textarea>
                `;
            }

            // Hint & Feedback Area (Hidden initially)
            inputHTML += `
                <div id="feedback-${q.id}" class="mt-4 hidden p-4 rounded-lg bg-gray-100 text-sm">
                    <p class="font-bold mb-1">Kunci Jawaban:</p>
                    <p class="text-red-700 font-semibold">${Array.isArray(q.answer) ? q.answer.join(", ") : q.answer}</p>
                    <p class="text-gray-500 text-xs mt-2 italic">Hint: ${q.hint}</p>
                </div>
            `;

            card.innerHTML = questionHTML + inputHTML;
            container.appendChild(card);
        });

        // Handle Submission
        document.getElementById('quizForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            let score = 0;
            let totalObjective = 0;
            const formData = new FormData(e.target);
            const resultDetails = document.getElementById('resultDetails');
            resultDetails.innerHTML = ""; // Clear prev results

            questions.forEach(q => {
                const feedbackEl = document.getElementById(`feedback-${q.id}`);
                feedbackEl.classList.remove('hidden'); // Show answers
                
                let isCorrect = false;
                let userAnswer = "";

                // Logic Penilaian
                if (q.type === 'pg' || q.type === 'tf') {
                    totalObjective++;
                    userAnswer = formData.get(`q${q.id}`);
                    if (userAnswer === q.answer) {
                        score++;
                        isCorrect = true;
                        feedbackEl.classList.add('bg-red-100', 'border', 'border-red-300');
                    } else {
                        feedbackEl.classList.add('bg-gray-100', 'border', 'border-gray-300');
                    }
                } 
                else if (q.type === 'pg_kompleks') {
                    totalObjective++;
                    // Get all checked values
                    const checked = formData.getAll(`q${q.id}`);
                    userAnswer = checked.join(", ");
                    
                    // Simple array comparison (must match exactly)
                    const sortedUser = checked.sort().toString();
                    const sortedAns = q.answer.sort().toString();
                    
                    if (sortedUser === sortedAns && checked.length > 0) {
                        score++;
                        isCorrect = true;
                        feedbackEl.classList.add('bg-red-100', 'border', 'border-red-300');
                    } else {
                        feedbackEl.classList.add('bg-gray-100', 'border', 'border-gray-300');
                    }
                }
                else if (q.type === 'isian') {
                    totalObjective++;
                    userAnswer = formData.get(`q${q.id}`)?.trim() || "";
                    if (userAnswer.toLowerCase() === q.answer.toLowerCase()) {
                        score++;
                        isCorrect = true;
                        feedbackEl.classList.add('bg-red-100', 'border', 'border-red-300');
                    } else {
                        feedbackEl.classList.add('bg-gray-100', 'border', 'border-gray-300');
                    }
                }
                else if (q.type === 'uraian') {
                    // Uraian tidak dinilai otomatis
                    userAnswer = formData.get(`q${q.id}`);
                    feedbackEl.classList.add('bg-orange-50', 'border', 'border-orange-200');
                    feedbackEl.innerHTML += `<p class='text-orange-600 font-bold mt-2'>*Cek jawabanmu dengan kunci jawaban di atas.</p>`;
                }

                // Add simple summary to modal
                if(q.type !== 'uraian') {
                    const icon = isCorrect ? "✅" : "❌";
                    const item = document.createElement('div');
                    item.innerHTML = `<span>${icon} No. ${q.id}</span>`;
                    resultDetails.appendChild(item);
                }
            });

            // Calculate Score (Scale 0-100 for objective parts)
            let finalScore = 0;
            if (totalObjective > 0) {
                finalScore = Math.round((score / totalObjective) * 100);
            }
            
            // Show Modal
            document.getElementById('finalScore').textContent = finalScore;
            document.getElementById('resultModal').classList.remove('hidden');
        });

        // Close Modal
        document.getElementById('closeModalBtn').addEventListener('click', function() {
            document.getElementById('resultModal').classList.add('hidden');
            // Scroll to top to review
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });
    </script>
</body>
</html>
