<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latihan Soal Bahasa Inggris - Unit 3: Keep Your Body Clean</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Nunito', sans-serif;
            background-color: #f0fdf4; /* Light green background */
        }
        h1, h2, h3 {
            font-family: 'Fredoka', sans-serif;
        }
        .quiz-card {
            transition: all 0.3s ease;
            border-left: 5px solid transparent;
        }
        .quiz-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }
        .quiz-card.answered {
            border-left-color: #22c55e;
        }
        /* Custom Radio & Checkbox */
        .option-container {
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .option-container:hover {
            background-color: #f3f4f6;
        }
        .option-input:checked + .option-label {
            color: #15803d;
            font-weight: bold;
        }
        .result-box {
            animation: slideIn 0.5s ease-out;
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-green-50 min-h-screen pb-20">

    <!-- Header -->
    <header class="bg-green-600 text-white p-6 shadow-lg sticky top-0 z-50">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <div>
                <h1 class="text-2xl md:text-3xl font-bold">English Quiz</h1>
                <p class="text-green-100 text-sm md:text-base">Unit 3: Keep Your Body Clean</p>
            </div>
            <div class="text-right hidden md:block">
                <p class="font-semibold">Kelas 2 SD</p>
                <p class="text-xs text-green-200">40 Questions</p>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-4xl mx-auto p-4 mt-6">
        <form id="quizForm" class="space-y-6">
            
            <!-- Container Soal akan di-generate oleh JavaScript -->
            <div id="questions-container"></div>

            <!-- Tombol Submit -->
            <div class="mt-10 mb-20 text-center">
                <button type="submit" class="bg-green-600 hover:bg-green-700 text-white font-bold py-4 px-10 rounded-full shadow-lg transform transition hover:scale-105 text-lg flex items-center justify-center mx-auto gap-2">
                    <span>✅ Selesai & Lihat Nilai</span>
                </button>
            </div>
        </form>
    </main>

    <!-- Modal Hasil -->
    <div id="resultModal" class="fixed inset-0 bg-black bg-opacity-50 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl max-w-2xl w-full max-h-[90vh] overflow-y-auto result-box">
            <div class="p-6 md:p-8">
                <div class="text-center mb-6">
                    <div class="inline-block p-4 rounded-full bg-green-100 mb-4">
                        <span class="text-4xl">🏆</span>
                    </div>
                    <h2 class="text-3xl font-bold text-gray-800">Hasil Kuis</h2>
                    <p class="text-gray-600">Hebat! Kamu telah menyelesaikan latihan.</p>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-8">
                    <div class="bg-blue-50 p-4 rounded-xl border border-blue-200 text-center">
                        <p class="text-sm text-blue-600 font-semibold uppercase tracking-wider">Skor Objektif</p>
                        <p id="finalScore" class="text-4xl font-bold text-blue-800">0</p>
                        <p class="text-xs text-blue-500 mt-1">(Dari soal PG, Isian, B/S)</p>
                    </div>
                    <div class="bg-orange-50 p-4 rounded-xl border border-orange-200 text-center">
                        <p class="text-sm text-orange-600 font-semibold uppercase tracking-wider">Soal Uraian</p>
                        <p class="text-lg font-bold text-orange-800">Cek Manual</p>
                        <p class="text-xs text-orange-500 mt-1">(Minta orang tua/guru menilai)</p>
                    </div>
                </div>

                <!-- Pembahasan Singkat -->
                <div class="bg-gray-50 rounded-xl p-4 mb-6">
                    <h3 class="font-bold text-gray-700 mb-2">Rincian Jawaban:</h3>
                    <div id="resultDetails" class="space-y-2 text-sm text-gray-600 max-h-40 overflow-y-auto">
                        <!-- Detail will be injected here -->
                    </div>
                </div>

                <div class="flex flex-col md:flex-row gap-3 justify-center">
                    <button id="closeModalBtn" class="px-6 py-3 bg-gray-200 hover:bg-gray-300 text-gray-700 font-semibold rounded-lg transition">
                        Tutup & Lihat Pembahasan
                    </button>
                    <button onclick="location.reload()" class="px-6 py-3 bg-green-600 hover:bg-green-700 text-white font-semibold rounded-lg transition">
                        Ulangi Tes
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Data Soal & Script -->
    <script>
        // Data Soal (40 Soal)
        const questions = [
            // --- BAGIAN 1: PILIHAN GANDA (1-10) ---
            {
                id: 1, type: 'pg', question: "What part of the body is this? ( 👀 )",
                options: ["Nose", "Eyes", "Ears", "Mouth"], answer: "Eyes",
                hint: "You use them to see."
            },
            {
                id: 2, type: 'pg', question: "I use my ... to listen to music.",
                options: ["Eyes", "Ears", "Nose", "Hands"], answer: "Ears",
                hint: "It is on the side of your head."
            },
            {
                id: 3, type: 'pg', question: "Look at the picture! The boy is ... his teeth.",
                options: ["Washing", "Brushing", "Combing", "Eating"], answer: "Brushing",
                hint: "Using a toothbrush and toothpaste."
            },
            {
                id: 4, type: 'pg', question: "My hands are dirty. I must ... my hands.",
                options: ["Wash", "Comb", "Brush", "Eat"], answer: "Wash",
                hint: "Use water and soap."
            },
            {
                id: 5, type: 'pg', question: "We wear a ... to cover our nose and mouth.",
                options: ["Hat", "Mask", "Glasses", "Shoes"], answer: "Mask",
                hint: "To protect from virus or dust."
            },
            {
                id: 6, type: 'pg', question: "After playing football, my feet are ...",
                options: ["Clean", "Dirty", "Happy", "Hungry"], answer: "Dirty",
                hint: "Not clean."
            },
            {
                id: 7, type: 'pg', question: "I have ten ... on my hands.",
                options: ["Toes", "Fingers", "Knees", "Eyes"], answer: "Fingers",
                hint: "You use them to hold things."
            },
            {
                id: 8, type: 'pg', question: "What is 'Rambut' in English?",
                options: ["Head", "Hand", "Hair", "Face"], answer: "Hair",
                hint: "It grows on top of your head."
            },
            {
                id: 9, type: 'pg', question: "What shape is a slice of pizza usually?",
                options: ["Circle", "Triangle", "Square", "Star"], answer: "Triangle",
                hint: "It has 3 sides."
            },
            {
                id: 10, type: 'pg', question: "To keep my hair tidy, I ... it.",
                options: ["Wash", "Brush", "Comb", "Clean"], answer: "Comb",
                hint: "Using a comb."
            },

            // --- BAGIAN 2: BENAR / SALAH (11-20) ---
            {
                id: 11, type: 'tf', question: "We use soap to wash our hands.",
                options: ["True", "False"], answer: "True",
                hint: "Soap kills germs."
            },
            {
                id: 12, type: 'tf', question: "We have two noses.",
                options: ["True", "False"], answer: "False",
                hint: "Touch your face, how many noses?"
            },
            {
                id: 13, type: 'tf', question: "'Clean' means 'Kotor' in Indonesian.",
                options: ["True", "False"], answer: "False",
                hint: "Clean means Bersih."
            },
            {
                id: 14, type: 'tf', question: "We use our feet to walk.",
                options: ["True", "False"], answer: "True",
                hint: "We walk and run with them."
            },
            {
                id: 15, type: 'tf', question: "We use shampoo to brush our teeth.",
                options: ["True", "False"], answer: "False",
                hint: "Shampoo is for hair."
            },
            {
                id: 16, type: 'tf', question: "We should wash our hands before eating.",
                options: ["True", "False"], answer: "True",
                hint: "To remove dirt before touching food."
            },
            {
                id: 17, type: 'tf', question: "A star has 5 points.",
                options: ["True", "False"], answer: "True",
                hint: "Like the shape in the sky."
            },
            {
                id: 18, type: 'tf', question: "We use a towel to wet our hands.",
                options: ["True", "False"], answer: "False",
                hint: "Towel is to DRY hands."
            },
            {
                id: 19, type: 'tf', question: "Stomach is part of our body.",
                options: ["True", "False"], answer: "True",
                hint: "It's where food goes."
            },
            {
                id: 20, type: 'tf', question: "We wash our face with toothpaste.",
                options: ["True", "False"], answer: "False",
                hint: "Toothpaste is for teeth."
            },

            // --- BAGIAN 3: ISIAN SINGKAT (21-30) ---
            {
                id: 21, type: 'isian', question: "I use my m_uth to eat.",
                answer: "mouth", hint: "Bagian tubuh untuk makan."
            },
            {
                id: 22, type: 'isian', question: "Use s_ap to wash your hands.",
                answer: "soap", hint: "Benda berbusa untuk mandi/cuci tangan."
            },
            {
                id: 23, type: 'isian', question: "Bahasa Inggris dari 'Wajah' adalah ...",
                answer: "face", hint: "Depan kepala kita."
            },
            {
                id: 24, type: 'isian', question: "My hands are d_rty (kotor).",
                answer: "dirty", hint: "Lawan kata clean."
            },
            {
                id: 25, type: 'isian', question: "I have two e_es to see.",
                answer: "eyes", hint: "Organ penglihatan."
            },
            {
                id: 26, type: 'isian', question: "Step 1 washing hands: ... your hands with water.",
                answer: "wet", hint: "Membasahi tangan."
            },
            {
                id: 27, type: 'isian', question: "Step 5 washing hands: ... your hands with a towel.",
                answer: "dry", hint: "Mengeringkan tangan."
            },
            {
                id: 28, type: 'isian', question: "Bahasa Inggris dari 'Gigi' adalah ...",
                answer: "teeth", hint: "Yang disikat setiap hari."
            },
            {
                id: 29, type: 'isian', question: "I ... my mask. (memakai)",
                answer: "wear", hint: "Kata kerja memakai."
            },
            {
                id: 30, type: 'isian', question: "Shape of a ball is ...",
                answer: "circle", hint: "Bulat/Lingkaran."
            },

            // --- BAGIAN 4: PILIHAN GANDA KOMPLEKS (31-35) ---
            {
                id: 31, type: 'pg_kompleks', question: "Select 2 parts of the face.",
                options: ["Nose", "Stomach", "Eyes", "Feet"], answer: ["Nose", "Eyes"],
                hint: "Pilih bagian yang ada di wajah."
            },
            {
                id: 32, type: 'pg_kompleks', question: "Select 2 things used to clean the body.",
                options: ["Soap", "Pencil", "Shampoo", "Book"], answer: ["Soap", "Shampoo"],
                hint: "Alat untuk membersihkan badan."
            },
            {
                id: 33, type: 'pg_kompleks', question: "Select 2 shapes mentioned in the book.",
                options: ["Star", "Car", "Triangle", "Apple"], answer: ["Star", "Triangle"],
                hint: "Pilih nama-nama bentuk (shapes)."
            },
            {
                id: 34, type: 'pg_kompleks', question: "What do you do to keep clean? (Select 2)",
                options: ["Wash hands", "Play in mud", "Brush teeth", "Eat candy"], answer: ["Wash hands", "Brush teeth"],
                hint: "Kegiatan menjaga kebersihan."
            },
            {
                id: 35, type: 'pg_kompleks', question: "Steps to wash hands? (Select 2)",
                options: ["Scrub", "Jump", "Rinse", "Sleep"], answer: ["Scrub", "Rinse"],
                hint: "Langkah-langkah mencuci tangan."
            },

            // --- BAGIAN 5: URAIAN (36-40) ---
            {
                id: 36, type: 'uraian', question: "Mention 3 parts of your body!",
                answer: "Eyes, Nose, Mouth, Ears, Hands, Feet, dll.", 
                hint: "Sebutkan 3 bagian tubuh."
            },
            {
                id: 37, type: 'uraian', question: "Translate to English: 'Saya mencuci tangan saya'.",
                answer: "I wash my hands.", 
                hint: "Terjemahkan ke Bahasa Inggris."
            },
            {
                id: 38, type: 'uraian', question: "Why must we wash our hands?",
                answer: "To be clean / To kill germs / Supaya bersih.", 
                hint: "Kenapa kita harus cuci tangan?"
            },
            {
                id: 39, type: 'uraian', question: "Mention 2 steps of washing hands!",
                answer: "Wet your hands, Get soap, Scrub your hands, Rinse, Dry.", 
                hint: "Sebutkan 2 langkah cuci tangan."
            },
            {
                id: 40, type: 'uraian', question: "Translate to Indonesian: 'My hair is clean'.",
                answer: "Rambut saya bersih.", 
                hint: "Terjemahkan ke Bahasa Indonesia."
            }
        ];

        // Render Questions
        const container = document.getElementById('questions-container');

        questions.forEach((q, index) => {
            const card = document.createElement('div');
            card.className = "quiz-card bg-white rounded-xl shadow-md p-6 border border-gray-100 relative overflow-hidden";
            
            // Badge Tipe Soal
            let typeLabel = "";
            let typeColor = "bg-gray-200 text-gray-700";
            if(q.type === 'pg') { typeLabel = "Pilihan Ganda"; typeColor = "bg-blue-100 text-blue-700"; }
            if(q.type === 'tf') { typeLabel = "Benar / Salah"; typeColor = "bg-purple-100 text-purple-700"; }
            if(q.type === 'isian') { typeLabel = "Isian Singkat"; typeColor = "bg-yellow-100 text-yellow-700"; }
            if(q.type === 'pg_kompleks') { typeLabel = "Pilihan Ganda Kompleks"; typeColor = "bg-pink-100 text-pink-700"; }
            if(q.type === 'uraian') { typeLabel = "Uraian"; typeColor = "bg-orange-100 text-orange-700"; }

            let questionHTML = `
                <div class="flex justify-between items-start mb-4">
                    <div class="flex items-center gap-2">
                        <span class="flex items-center justify-center w-8 h-8 rounded-full bg-green-600 text-white font-bold">${index + 1}</span>
                        <span class="text-xs font-semibold px-2 py-1 rounded ${typeColor}">${typeLabel}</span>
                    </div>
                </div>
                <div class="mb-4">
                    <p class="text-lg text-gray-800 font-medium">${q.question}</p>
                    ${q.type === 'pg_kompleks' ? '<p class="text-xs text-pink-600 mt-1">*Pilih lebih dari satu jawaban</p>' : ''}
                </div>
            `;

            // Render Options based on Type
            let inputHTML = '';
            
            if (q.type === 'pg' || q.type === 'tf') {
                inputHTML += `<div class="space-y-3">`;
                q.options.forEach(opt => {
                    inputHTML += `
                        <label class="option-container flex items-center p-3 rounded-lg border border-gray-200 hover:border-green-400">
                            <input type="radio" name="q${q.id}" value="${opt}" class="option-input form-radio h-5 w-5 text-green-600 focus:ring-green-500">
                            <span class="option-label ml-3 text-gray-700">${opt}</span>
                        </label>
                    `;
                });
                inputHTML += `</div>`;
            } 
            else if (q.type === 'pg_kompleks') {
                inputHTML += `<div class="space-y-3">`;
                q.options.forEach(opt => {
                    inputHTML += `
                        <label class="option-container flex items-center p-3 rounded-lg border border-gray-200 hover:border-green-400">
                            <input type="checkbox" name="q${q.id}" value="${opt}" class="option-input form-checkbox h-5 w-5 text-green-600 focus:ring-green-500 rounded">
                            <span class="option-label ml-3 text-gray-700">${opt}</span>
                        </label>
                    `;
                });
                inputHTML += `</div>`;
            }
            else if (q.type === 'isian') {
                inputHTML += `
                    <input type="text" name="q${q.id}" placeholder="Ketik jawabanmu di sini..." class="w-full p-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-transparent bg-gray-50">
                `;
            }
            else if (q.type === 'uraian') {
                inputHTML += `
                    <textarea name="q${q.id}" rows="3" placeholder="Tulis jawaban lengkapmu di sini..." class="w-full p-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-transparent bg-gray-50"></textarea>
                `;
            }

            // Hint & Feedback Area (Hidden initially)
            inputHTML += `
                <div id="feedback-${q.id}" class="mt-4 hidden p-4 rounded-lg bg-gray-100 text-sm">
                    <p class="font-bold mb-1">Kunci Jawaban:</p>
                    <p class="text-green-700 font-semibold">${Array.isArray(q.answer) ? q.answer.join(", ") : q.answer}</p>
                    <p class="text-gray-500 text-xs mt-2 italic">Hint: ${q.hint}</p>
                </div>
            `;

            card.innerHTML = questionHTML + inputHTML;
            container.appendChild(card);
        });

        // Handle Submission
        document.getElementById('quizForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            let score = 0;
            let totalObjective = 0;
            const formData = new FormData(e.target);
            const resultDetails = document.getElementById('resultDetails');
            resultDetails.innerHTML = ""; // Clear prev results

            questions.forEach(q => {
                const feedbackEl = document.getElementById(`feedback-${q.id}`);
                feedbackEl.classList.remove('hidden'); // Show answers
                
                let isCorrect = false;
                let userAnswer = "";

                // Logic Penilaian
                if (q.type === 'pg' || q.type === 'tf') {
                    totalObjective++;
                    userAnswer = formData.get(`q${q.id}`);
                    if (userAnswer === q.answer) {
                        score++;
                        isCorrect = true;
                        feedbackEl.classList.add('bg-green-100', 'border', 'border-green-300');
                    } else {
                        feedbackEl.classList.add('bg-red-50', 'border', 'border-red-200');
                    }
                } 
                else if (q.type === 'pg_kompleks') {
                    totalObjective++;
                    // Get all checked values
                    const checked = formData.getAll(`q${q.id}`);
                    userAnswer = checked.join(", ");
                    
                    // Simple array comparison (must match exactly)
                    // Sort both arrays to compare content
                    const sortedUser = checked.sort().toString();
                    const sortedAns = q.answer.sort().toString();
                    
                    if (sortedUser === sortedAns && checked.length > 0) {
                        score++;
                        isCorrect = true;
                        feedbackEl.classList.add('bg-green-100', 'border', 'border-green-300');
                    } else {
                        feedbackEl.classList.add('bg-red-50', 'border', 'border-red-200');
                    }
                }
                else if (q.type === 'isian') {
                    totalObjective++;
                    userAnswer = formData.get(`q${q.id}`).trim();
                    if (userAnswer.toLowerCase() === q.answer.toLowerCase()) {
                        score++;
                        isCorrect = true;
                        feedbackEl.classList.add('bg-green-100', 'border', 'border-green-300');
                    } else {
                        feedbackEl.classList.add('bg-red-50', 'border', 'border-red-200');
                    }
                }
                else if (q.type === 'uraian') {
                    // Uraian tidak dinilai otomatis
                    userAnswer = formData.get(`q${q.id}`);
                    feedbackEl.classList.add('bg-orange-50', 'border', 'border-orange-200');
                    feedbackEl.innerHTML += `<p class='text-orange-600 font-bold mt-2'>*Cek jawabanmu dengan kunci jawaban di atas.</p>`;
                }

                // Add simple summary to modal
                if(q.type !== 'uraian') {
                    const icon = isCorrect ? "✅" : "❌";
                    const item = document.createElement('div');
                    item.innerHTML = `<span>${icon} No. ${q.id}</span>`;
                    resultDetails.appendChild(item);
                }
            });

            // Calculate Score (Scale 0-100 for objective parts)
            const finalScore = Math.round((score / totalObjective) * 100);
            
            // Show Modal
            document.getElementById('finalScore').textContent = finalScore;
            document.getElementById('resultModal').classList.remove('hidden');
        });

        // Close Modal
        document.getElementById('closeModalBtn').addEventListener('click', function() {
            document.getElementById('resultModal').classList.add('hidden');
            // Scroll to top to review
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });
    </script>
</body>
</html>
