<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latihan Soal IPAS - Matahari, Cuaca, & Identitas Diri</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Nunito', sans-serif;
            background-color: #f0f9ff; /* Sky blue background */
        }
        h1, h2, h3 {
            font-family: 'Fredoka', sans-serif;
        }
        .quiz-card {
            transition: all 0.3s ease;
            border-left: 5px solid transparent;
        }
        .quiz-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }
        .quiz-card.answered {
            border-left-color: #0ea5e9;
        }
        .option-container {
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .option-container:hover {
            background-color: #e0f2fe;
        }
        .option-input:checked + .option-label {
            color: #0284c7;
            font-weight: bold;
        }
        .result-box {
            animation: slideIn 0.5s ease-out;
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-sky-50 min-h-screen pb-20">

    <!-- Header -->
    <header class="bg-sky-600 text-white p-6 shadow-lg sticky top-0 z-50">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <div>
                <h1 class="text-2xl md:text-3xl font-bold">Latihan Soal IPAS</h1>
                <p class="text-sky-100 text-sm md:text-base">Bab 3 & 4: Matahari, Cuaca, Identitas Diri</p>
            </div>
            <div class="text-right hidden md:block">
                <p class="font-semibold">Kelas 2 SD</p>
                <p class="text-xs text-sky-200">40 Soal</p>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-4xl mx-auto p-4 mt-6">
        <form id="quizForm" class="space-y-6">
            
            <!-- Container Soal -->
            <div id="questions-container"></div>

            <!-- Tombol Submit -->
            <div class="mt-10 mb-20 text-center">
                <button type="submit" class="bg-sky-600 hover:bg-sky-700 text-white font-bold py-4 px-10 rounded-full shadow-lg transform transition hover:scale-105 text-lg flex items-center justify-center mx-auto gap-2">
                    <span>✅ Selesai & Lihat Nilai</span>
                </button>
            </div>
        </form>
    </main>

    <!-- Modal Hasil -->
    <div id="resultModal" class="fixed inset-0 bg-black bg-opacity-50 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl max-w-2xl w-full max-h-[90vh] overflow-y-auto result-box">
            <div class="p-6 md:p-8">
                <div class="text-center mb-6">
                    <div class="inline-block p-4 rounded-full bg-sky-100 mb-4">
                        <span class="text-4xl">☀️</span>
                    </div>
                    <h2 class="text-3xl font-bold text-gray-800">Hasil Latihan</h2>
                    <p class="text-gray-600">Hebat! Kamu telah menyelesaikan latihan IPAS.</p>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-8">
                    <div class="bg-blue-50 p-4 rounded-xl border border-blue-200 text-center">
                        <p class="text-sm text-blue-600 font-semibold uppercase tracking-wider">Skor Objektif</p>
                        <p id="finalScore" class="text-4xl font-bold text-blue-800">0</p>
                        <p class="text-xs text-blue-500 mt-1">(PG, Benar/Salah, Isian, PG Kompleks)</p>
                    </div>
                    <div class="bg-orange-50 p-4 rounded-xl border border-orange-200 text-center">
                        <p class="text-sm text-orange-600 font-semibold uppercase tracking-wider">Soal Uraian</p>
                        <p class="text-lg font-bold text-orange-800">Cek Manual</p>
                        <p class="text-xs text-orange-500 mt-1">(Minta orang tua/guru menilai)</p>
                    </div>
                </div>

                <!-- Rincian -->
                <div class="bg-gray-50 rounded-xl p-4 mb-6">
                    <h3 class="font-bold text-gray-700 mb-2">Rincian Jawaban:</h3>
                    <div id="resultDetails" class="space-y-2 text-sm text-gray-600 max-h-40 overflow-y-auto">
                        <!-- Detail will be injected here -->
                    </div>
                </div>

                <div class="flex flex-col md:flex-row gap-3 justify-center">
                    <button id="closeModalBtn" class="px-6 py-3 bg-gray-200 hover:bg-gray-300 text-gray-700 font-semibold rounded-lg transition">
                        Tutup & Lihat Pembahasan
                    </button>
                    <button onclick="location.reload()" class="px-6 py-3 bg-sky-600 hover:bg-sky-700 text-white font-semibold rounded-lg transition">
                        Ulangi Latihan
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Data Soal (40 Soal berdasarkan Kisi-kisi IPAS)
        const questions = [
            // --- BAGIAN 1: PILIHAN GANDA (1-12) ---
            {
                id: 1, type: 'pg', question: "Matahari terbit dari sebelah ...",
                options: ["Barat", "Timur", "Utara", "Selatan"], answer: "Timur",
                hint: "Arah munculnya matahari di pagi hari."
            },
            {
                id: 2, type: 'pg', question: "Pada siang hari yang terik, bayang-bayang tubuh kita akan terlihat ...",
                options: ["Sangat panjang", "Paling pendek", "Hilang", "Miring ke timur"], answer: "Paling pendek",
                hint: "Karena matahari berada tepat di atas kepala."
            },
            {
                id: 3, type: 'pg', question: "Lembaga di Indonesia yang bertugas memberikan informasi perkiraan cuaca adalah ...",
                options: ["KPK", "BMKG", "TNI", "PLN"], answer: "BMKG",
                hint: "Badan Meteorologi, Klimatologi, dan Geofisika."
            },
            {
                id: 4, type: 'pg', question: "Pakaian yang cocok digunakan saat cuaca cerah dan panas adalah yang berbahan ...",
                options: ["Wol tebal", "Katun yang menyerap keringat", "Plastik", "Kulit hewan"], answer: "Katun yang menyerap keringat",
                hint: "Agar tubuh tidak kepanasan."
            },
            {
                id: 5, type: 'pg', question: "Setiap penduduk Indonesia yang sudah berusia 17 tahun wajib memiliki ...",
                options: ["SIM", "KTP", "STNK", "Paspor"], answer: "KTP",
                hint: "Kartu Tanda Penduduk."
            },
            {
                id: 6, type: 'pg', question: "Sinar matahari pagi terasa ... di kulit dan baik untuk kesehatan.",
                options: ["Panas menyengat", "Dingin", "Hangat", "Sakit"], answer: "Hangat",
                hint: "Nyaman untuk berjemur."
            },
            {
                id: 7, type: 'pg', question: "Jika langit tampak gelap dan awan hitam berkumpul, itu tanda akan ...",
                options: ["Cerah", "Panas", "Hujan", "Berangin"], answer: "Hujan",
                hint: "Awan mendung membawa air."
            },
            {
                id: 8, type: 'pg', question: "Matahari terbenam di sebelah ...",
                options: ["Timur", "Barat", "Selatan", "Utara"], answer: "Barat",
                hint: "Lawan arah terbit."
            },
            {
                id: 9, type: 'pg', question: "Data yang menunjukkan lokasi tempat tinggal seseorang disebut ...",
                options: ["Nama", "Tanggal lahir", "Alamat", "Hobi"], answer: "Alamat",
                hint: "Jalan, nomor rumah, RT/RW."
            },
            {
                id: 10, type: 'pg', question: "Bencana alam yang bisa terjadi jika hujan turun terus menerus adalah ...",
                options: ["Gempa bumi", "Tsunami", "Banjir", "Gunung meletus"], answer: "Banjir",
                hint: "Air sungai meluap."
            },
            {
                id: 11, type: 'pg', question: "Dokumen yang harus dibawa ayah saat mengendarai motor adalah ...",
                options: ["KTP dan Akta Lahir", "SIM dan STNK", "Rapor dan Buku", "Kartu Keluarga"], answer: "SIM dan STNK",
                hint: "Surat Izin Mengemudi."
            },
            {
                id: 12, type: 'pg', question: "Identitas diri yang membedakan panggilan kita dengan orang lain adalah ...",
                options: ["Nama", "Seragam", "Sepatu", "Tas"], answer: "Nama",
                hint: "Sebutan untuk memanggil seseorang."
            },

            // --- BAGIAN 2: BENAR / SALAH (13-22) ---
            {
                id: 13, type: 'tf', question: "Bayang-bayang terjadi karena cahaya matahari menembus benda bening.",
                options: ["Benar", "Salah"], answer: "Salah",
                hint: "Bayang-bayang terjadi karena cahaya terhalang benda gelap/padat."
            },
            {
                id: 14, type: 'tf', question: "Pada sore hari, bayang-bayang benda berada di sebelah timur.",
                options: ["Benar", "Salah"], answer: "Benar",
                hint: "Karena matahari ada di barat."
            },
            {
                id: 15, type: 'tf', question: "Cuaca cerah sangat baik untuk menjemur pakaian basah.",
                options: ["Benar", "Salah"], answer: "Benar",
                hint: "Panas matahari mengeringkan air."
            },
            {
                id: 16, type: 'tf', question: "SIM adalah singkatan dari Surat Izin Membaca.",
                options: ["Benar", "Salah"], answer: "Salah",
                hint: "SIM = Surat Izin Mengemudi."
            },
            {
                id: 17, type: 'tf', question: "Nama panggilan biasanya lebih pendek dari nama lengkap.",
                options: ["Benar", "Salah"], answer: "Benar",
                hint: "Nama sapaan sehari-hari."
            },
            {
                id: 18, type: 'tf', question: "Kita boleh memberikan data identitas diri kepada orang asing yang tidak dikenal.",
                options: ["Benar", "Salah"], answer: "Salah",
                hint: "Berbahaya, data bisa disalahgunakan."
            },
            {
                id: 19, type: 'tf', question: "Pada siang hari, matahari berada hampir tegak lurus di atas kepala.",
                options: ["Benar", "Salah"], answer: "Benar",
                hint: "Waktu paling panas."
            },
            {
                id: 20, type: 'tf', question: "Cuaca berawan artinya langit penuh dengan bintang.",
                options: ["Benar", "Salah"], answer: "Salah",
                hint: "Berawan artinya banyak awan menutupi matahari."
            },
            {
                id: 21, type: 'tf', question: "KTP berisi data seperti Nama, Tempat Tanggal Lahir, dan Alamat.",
                options: ["Benar", "Salah"], answer: "Benar",
                hint: "Data dasar penduduk."
            },
            {
                id: 22, type: 'tf', question: "Saat hujan deras disertai petir, aman untuk bermain layang-layang di lapangan.",
                options: ["Benar", "Salah"], answer: "Salah",
                hint: "Sangat berbahaya tersambar petir."
            },

            // --- BAGIAN 3: ISIAN SINGKAT (23-30) ---
            {
                id: 23, type: 'isian', question: "Matahari terbit di sebelah timur pada waktu ... hari.",
                answer: "pagi", hint: "Awal hari."
            },
            {
                id: 24, type: 'isian', question: "Bayang-bayang terbentuk karena cahaya matahari ... oleh benda.",
                answer: "terhalang", hint: "Tidak bisa tembus."
            },
            {
                id: 25, type: 'isian', question: "Lembaga yang mengurus perkiraan cuaca disingkat dengan huruf ...",
                answer: "bmkg", hint: "4 huruf kapital."
            },
            {
                id: 26, type: 'isian', question: "Surat Izin Mengemudi disingkat menjadi ...",
                answer: "sim", hint: "3 huruf kapital."
            },
            {
                id: 27, type: 'isian', question: "Saat cuaca dingin atau hujan, kita sebaiknya memakai ... agar hangat.",
                answer: "jaket", hint: "Pakaian tebal."
            },
            {
                id: 28, type: 'isian', question: "Benda langit yang terlihat bersinar pada malam hari adalah bulan dan ...",
                answer: "bintang", hint: "Benda kecil berkelip."
            },
            {
                id: 29, type: 'isian', question: "Keadaan udara pada suatu tempat dan waktu tertentu disebut ...",
                answer: "cuaca", hint: "Bisa berubah-ubah (panas/hujan)."
            },
            {
                id: 30, type: 'isian', question: "Dokumen tanda penduduk yang wajib dimiliki usia 17 tahun ke atas adalah ...",
                answer: "ktp", hint: "Kartu Tanda Penduduk."
            },

            // --- BAGIAN 4: PILIHAN GANDA KOMPLEKS (31-35) ---
            {
                id: 31, type: 'pg_kompleks', question: "Pilih 2 ciri-ciri akan turun hujan:",
                options: ["Langit gelap/mendung", "Matahari bersinar terik", "Angin kencang", "Udara sangat panas"], answer: ["Langit gelap/mendung", "Angin kencang"],
                hint: "Tanda-tanda hujan."
            },
            {
                id: 32, type: 'pg_kompleks', question: "Pilih 2 data yang ada di dalam KTP:",
                options: ["Nama Lengkap", "Daftar belanja", "Alamat", "Nilai Rapor"], answer: ["Nama Lengkap", "Alamat"],
                hint: "Identitas seseorang."
            },
            {
                id: 33, type: 'pg_kompleks', question: "Pilih 2 dokumen yang biasa disimpan di dompet ayah:",
                options: ["SIM", "Ijazah Sekolah", "KTP", "Sertifikat Rumah"], answer: ["SIM", "KTP"],
                hint: "Kartu berukuran kecil."
            },
            {
                id: 34, type: 'pg_kompleks', question: "Pilih 2 jenis cuaca yang kamu ketahui:",
                options: ["Cerah", "Sedih", "Hujan", "Marah"], answer: ["Cerah", "Hujan"],
                hint: "Keadaan alam, bukan perasaan."
            },
            {
                id: 35, type: 'pg_kompleks', question: "Pilih 2 waktu dimana bayang-bayang terlihat panjang:",
                options: ["Pagi hari", "Siang bolong (jam 12)", "Sore hari", "Tengah malam"], answer: ["Pagi hari", "Sore hari"],
                hint: "Saat matahari masih rendah."
            },

            // --- BAGIAN 5: URAIAN (36-40) ---
            {
                id: 36, type: 'uraian', question: "Mengapa panjang dan arah bayang-bayang bisa berubah-ubah?",
                answer: "Karena posisi matahari berubah dari terbit sampai terbenam.", 
                hint: "Hubungannya dengan gerak matahari."
            },
            {
                id: 37, type: 'uraian', question: "Sebutkan 3 jenis cuaca yang ada di Indonesia!",
                answer: "Cerah, Berawan, Hujan (atau Hujan Petir).", 
                hint: "Kondisi langit."
            },
            {
                id: 38, type: 'uraian', question: "Apa yang dimaksud dengan identitas diri?",
                answer: "Segala sesuatu yang menunjukkan diri seseorang (Nama, Tanggal Lahir, Alamat).", 
                hint: "Pengenal diri."
            },
            {
                id: 39, type: 'uraian', question: "Mengapa dokumen seperti KTP dan SIM harus dijaga dengan baik?",
                answer: "Agar tidak hilang, rusak, atau disalahgunakan orang lain.", 
                hint: "Pentingnya keamanan data."
            },
            {
                id: 40, type: 'uraian', question: "Jelaskan arah bayang-bayang saat pagi hari dan sore hari!",
                answer: "Pagi: Bayangan ke arah Barat. Sore: Bayangan ke arah Timur.", 
                hint: "Berlawanan dengan matahari."
            }
        ];

        // Render Questions
        const container = document.getElementById('questions-container');

        questions.forEach((q, index) => {
            const card = document.createElement('div');
            card.className = "quiz-card bg-white rounded-xl shadow-md p-6 border border-sky-100 relative overflow-hidden";
            
            // Badge Tipe Soal
            let typeLabel = "";
            let typeColor = "bg-gray-200 text-gray-700";
            if(q.type === 'pg') { typeLabel = "Pilihan Ganda"; typeColor = "bg-blue-100 text-blue-700"; }
            if(q.type === 'tf') { typeLabel = "Benar / Salah"; typeColor = "bg-purple-100 text-purple-700"; }
            if(q.type === 'isian') { typeLabel = "Isian Singkat"; typeColor = "bg-yellow-100 text-yellow-700"; }
            if(q.type === 'pg_kompleks') { typeLabel = "Pilihan Ganda Kompleks"; typeColor = "bg-pink-100 text-pink-700"; }
            if(q.type === 'uraian') { typeLabel = "Uraian"; typeColor = "bg-orange-100 text-orange-700"; }

            let questionHTML = `
                <div class="flex justify-between items-start mb-4">
                    <div class="flex items-center gap-2">
                        <span class="flex items-center justify-center w-8 h-8 rounded-full bg-sky-600 text-white font-bold">${index + 1}</span>
                        <span class="text-xs font-semibold px-2 py-1 rounded ${typeColor}">${typeLabel}</span>
                    </div>
                </div>
                <div class="mb-4">
                    <p class="text-lg text-gray-800 font-medium">${q.question}</p>
                    ${q.type === 'pg_kompleks' ? '<p class="text-xs text-pink-600 mt-1">*Pilih 2 jawaban yang benar</p>' : ''}
                </div>
            `;

            // Render Options based on Type
            let inputHTML = '';
            
            if (q.type === 'pg' || q.type === 'tf') {
                inputHTML += `<div class="space-y-3">`;
                q.options.forEach(opt => {
                    inputHTML += `
                        <label class="option-container flex items-center p-3 rounded-lg border border-gray-200 hover:border-sky-400">
                            <input type="radio" name="q${q.id}" value="${opt}" class="option-input form-radio h-5 w-5 text-sky-600 focus:ring-sky-500">
                            <span class="option-label ml-3 text-gray-700">${opt}</span>
                        </label>
                    `;
                });
                inputHTML += `</div>`;
            } 
            else if (q.type === 'pg_kompleks') {
                inputHTML += `<div class="space-y-3">`;
                q.options.forEach(opt => {
                    inputHTML += `
                        <label class="option-container flex items-center p-3 rounded-lg border border-gray-200 hover:border-sky-400">
                            <input type="checkbox" name="q${q.id}" value="${opt}" class="option-input form-checkbox h-5 w-5 text-sky-600 focus:ring-sky-500 rounded">
                            <span class="option-label ml-3 text-gray-700">${opt}</span>
                        </label>
                    `;
                });
                inputHTML += `</div>`;
            }
            else if (q.type === 'isian') {
                inputHTML += `
                    <input type="text" name="q${q.id}" placeholder="Ketik jawaban singkat..." class="w-full p-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-sky-500 focus:border-transparent bg-gray-50">
                `;
            }
            else if (q.type === 'uraian') {
                inputHTML += `
                    <textarea name="q${q.id}" rows="3" placeholder="Tulis jawaban lengkapmu di sini..." class="w-full p-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-sky-500 focus:border-transparent bg-gray-50"></textarea>
                `;
            }

            // Hint & Feedback Area (Hidden initially)
            inputHTML += `
                <div id="feedback-${q.id}" class="mt-4 hidden p-4 rounded-lg bg-gray-100 text-sm">
                    <p class="font-bold mb-1">Kunci Jawaban:</p>
                    <p class="text-sky-700 font-semibold">${Array.isArray(q.answer) ? q.answer.join(", ") : q.answer}</p>
                    <p class="text-gray-500 text-xs mt-2 italic">Hint: ${q.hint}</p>
                </div>
            `;

            card.innerHTML = questionHTML + inputHTML;
            container.appendChild(card);
        });

        // Handle Submission
        document.getElementById('quizForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            let score = 0;
            let totalObjective = 0;
            const formData = new FormData(e.target);
            const resultDetails = document.getElementById('resultDetails');
            resultDetails.innerHTML = ""; // Clear prev results

            questions.forEach(q => {
                const feedbackEl = document.getElementById(`feedback-${q.id}`);
                feedbackEl.classList.remove('hidden'); // Show answers
                
                let isCorrect = false;
                let userAnswer = "";

                // Logic Penilaian
                if (q.type === 'pg' || q.type === 'tf') {
                    totalObjective++;
                    userAnswer = formData.get(`q${q.id}`);
                    if (userAnswer === q.answer) {
                        score++;
                        isCorrect = true;
                        feedbackEl.classList.add('bg-sky-100', 'border', 'border-sky-300');
                    } else {
                        feedbackEl.classList.add('bg-red-50', 'border', 'border-red-200');
                    }
                } 
                else if (q.type === 'pg_kompleks') {
                    totalObjective++;
                    // Get all checked values
                    const checked = formData.getAll(`q${q.id}`);
                    userAnswer = checked.join(", ");
                    
                    // Simple array comparison (must match exactly)
                    // Sort both arrays to compare content
                    const sortedUser = checked.sort().toString();
                    const sortedAns = q.answer.sort().toString();
                    
                    if (sortedUser === sortedAns && checked.length > 0) {
                        score++;
                        isCorrect = true;
                        feedbackEl.classList.add('bg-sky-100', 'border', 'border-sky-300');
                    } else {
                        feedbackEl.classList.add('bg-red-50', 'border', 'border-red-200');
                    }
                }
                else if (q.type === 'isian') {
                    totalObjective++;
                    userAnswer = formData.get(`q${q.id}`)?.trim() || "";
                    if (userAnswer.toLowerCase() === q.answer.toLowerCase()) {
                        score++;
                        isCorrect = true;
                        feedbackEl.classList.add('bg-sky-100', 'border', 'border-sky-300');
                    } else {
                        feedbackEl.classList.add('bg-red-50', 'border', 'border-red-200');
                    }
                }
                else if (q.type === 'uraian') {
                    // Uraian tidak dinilai otomatis
                    userAnswer = formData.get(`q${q.id}`);
                    feedbackEl.classList.add('bg-orange-50', 'border', 'border-orange-200');
                    feedbackEl.innerHTML += `<p class='text-orange-600 font-bold mt-2'>*Cek jawabanmu dengan kunci jawaban di atas.</p>`;
                }

                // Add simple summary to modal
                if(q.type !== 'uraian') {
                    const icon = isCorrect ? "✅" : "❌";
                    const item = document.createElement('div');
                    item.innerHTML = `<span>${icon} No. ${q.id}</span>`;
                    resultDetails.appendChild(item);
                }
            });

            // Calculate Score (Scale 0-100 for objective parts)
            let finalScore = 0;
            if (totalObjective > 0) {
                finalScore = Math.round((score / totalObjective) * 100);
            }
            
            // Show Modal
            document.getElementById('finalScore').textContent = finalScore;
            document.getElementById('resultModal').classList.remove('hidden');
        });

        // Close Modal
        document.getElementById('closeModalBtn').addEventListener('click', function() {
            document.getElementById('resultModal').classList.add('hidden');
            // Scroll to top to review
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });
    </script>
</body>
</html>
