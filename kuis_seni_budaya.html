<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latihan Soal Seni Budaya - Tari & Teater</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Nunito', sans-serif;
            background-color: #fdf2f8; /* Pink background */
        }
        h1, h2, h3 {
            font-family: 'Fredoka', sans-serif;
        }
        .quiz-card {
            transition: all 0.3s ease;
            border-left: 5px solid transparent;
        }
        .quiz-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }
        .quiz-card.answered {
            border-left-color: #db2777; /* Pink-600 */
        }
        .option-container {
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .option-container:hover {
            background-color: #fce7f3;
        }
        .option-input:checked + .option-label {
            color: #be185d;
            font-weight: bold;
        }
        .result-box {
            animation: slideIn 0.5s ease-out;
        }
        .question-svg {
            display: block;
            margin: 10px auto;
            max-width: 150px;
            height: auto;
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-pink-50 min-h-screen pb-20">

    <!-- Header -->
    <header class="bg-pink-600 text-white p-6 shadow-lg sticky top-0 z-50">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <div>
                <h1 class="text-2xl md:text-3xl font-bold">Latihan Soal Seni Budaya</h1>
                <p class="text-pink-100 text-sm md:text-base">Bab 3 & 4: Gerak Tari & Teater</p>
            </div>
            <div class="text-right hidden md:block">
                <p class="font-semibold">Kelas 2 SD</p>
                <p class="text-xs text-pink-200">40 Soal</p>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-4xl mx-auto p-4 mt-6">
        <form id="quizForm" class="space-y-6">
            
            <!-- Container Soal -->
            <div id="questions-container"></div>

            <!-- Tombol Submit -->
            <div class="mt-10 mb-20 text-center">
                <button type="submit" class="bg-pink-600 hover:bg-pink-700 text-white font-bold py-4 px-10 rounded-full shadow-lg transform transition hover:scale-105 text-lg flex items-center justify-center mx-auto gap-2">
                    <span>✅ Selesai & Lihat Nilai</span>
                </button>
            </div>
        </form>
    </main>

    <!-- Modal Hasil -->
    <div id="resultModal" class="fixed inset-0 bg-black bg-opacity-50 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl max-w-2xl w-full max-h-[90vh] overflow-y-auto result-box">
            <div class="p-6 md:p-8">
                <div class="text-center mb-6">
                    <div class="inline-block p-4 rounded-full bg-pink-100 mb-4">
                        <span class="text-4xl">🎨</span>
                    </div>
                    <h2 class="text-3xl font-bold text-gray-800">Hasil Latihan</h2>
                    <p class="text-gray-600">Hebat! Kamu telah menyelesaikan latihan Seni Budaya.</p>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-8">
                    <div class="bg-blue-50 p-4 rounded-xl border border-blue-200 text-center">
                        <p class="text-sm text-blue-600 font-semibold uppercase tracking-wider">Skor Objektif</p>
                        <p id="finalScore" class="text-4xl font-bold text-blue-800">0</p>
                        <p class="text-xs text-blue-500 mt-1">(PG, Benar/Salah, Isian, PG Kompleks)</p>
                    </div>
                    <div class="bg-orange-50 p-4 rounded-xl border border-orange-200 text-center">
                        <p class="text-sm text-orange-600 font-semibold uppercase tracking-wider">Soal Uraian</p>
                        <p class="text-lg font-bold text-orange-800">Cek Manual</p>
                        <p class="text-xs text-orange-500 mt-1">(Minta orang tua/guru menilai)</p>
                    </div>
                </div>

                <!-- Rincian -->
                <div class="bg-gray-50 rounded-xl p-4 mb-6">
                    <h3 class="font-bold text-gray-700 mb-2">Rincian Jawaban:</h3>
                    <div id="resultDetails" class="space-y-2 text-sm text-gray-600 max-h-40 overflow-y-auto">
                        <!-- Detail will be injected here -->
                    </div>
                </div>

                <div class="flex flex-col md:flex-row gap-3 justify-center">
                    <button id="closeModalBtn" class="px-6 py-3 bg-gray-200 hover:bg-gray-300 text-gray-700 font-semibold rounded-lg transition">
                        Tutup & Lihat Pembahasan
                    </button>
                    <button onclick="location.reload()" class="px-6 py-3 bg-pink-600 hover:bg-pink-700 text-white font-semibold rounded-lg transition">
                        Ulangi Latihan
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Koleksi SVG Sederhana untuk Ilustrasi (Simbolik)
        const svgs = {
            orang_menari: `<svg class="question-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><circle cx="50" cy="20" r="10" fill="#fbcfe8" stroke="#db2777" stroke-width="2"/><line x1="50" y1="30" x2="50" y2="60" stroke="#db2777" stroke-width="2"/><line x1="50" y1="40" x2="20" y2="30" stroke="#db2777" stroke-width="2"/><line x1="50" y1="40" x2="80" y2="30" stroke="#db2777" stroke-width="2"/><line x1="50" y1="60" x2="30" y2="90" stroke="#db2777" stroke-width="2"/><line x1="50" y1="60" x2="70" y2="90" stroke="#db2777" stroke-width="2"/></svg>`,
            wajah_senang: `<svg class="question-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><circle cx="50" cy="50" r="40" fill="#fef08a" stroke="#ca8a04" stroke-width="2"/><circle cx="35" cy="40" r="5" fill="#ca8a04"/><circle cx="65" cy="40" r="5" fill="#ca8a04"/><path d="M30,60 Q50,80 70,60" fill="none" stroke="#ca8a04" stroke-width="3"/></svg>`,
            wajah_sedih: `<svg class="question-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><circle cx="50" cy="50" r="40" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="2"/><circle cx="35" cy="40" r="5" fill="#1d4ed8"/><circle cx="65" cy="40" r="5" fill="#1d4ed8"/><path d="M30,70 Q50,50 70,70" fill="none" stroke="#1d4ed8" stroke-width="3"/></svg>`,
            panggung: `<svg class="question-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><rect x="10" y="60" width="80" height="30" fill="#78350f"/><path d="M10,60 Q50,10 90,60" fill="#b91c1c" opacity="0.3"/><rect x="5" y="60" width="5" height="40" fill="#451a03"/><rect x="90" y="60" width="5" height="40" fill="#451a03"/></svg>`
        };

        // Data Soal (40 Soal berdasarkan Kisi-kisi Seni Budaya)
        const questions = [
            // --- BAGIAN 1: PILIHAN GANDA (1-12) ---
            {
                id: 1, type: 'pg', question: "Ide dasar dalam sebuah tarian disebut ...",
                options: ["Gerak", "Tema", "Lagu", "Kostum"], answer: "Tema",
                hint: "Gagasan pokok tarian."
            },
            {
                id: 2, type: 'pg', question: "Gerak tari yang dilakukan dengan tidak berpindah tempat disebut ...",
                options: ["Gerak lokomotor", "Gerak di tempat", "Gerak berpindah", "Gerak lari"], answer: "Gerak di tempat",
                svg: svgs.orang_menari,
                hint: "Posisi kaki tetap di titik yang sama."
            },
            {
                id: 3, type: 'pg', question: "Gerak tari yang dilakukan dengan tenaga kuat akan menimbulkan kesan ...",
                options: ["Sedih", "Lemah", "Semangat", "Mengantuk"], answer: "Semangat",
                hint: "Penuh energi."
            },
            {
                id: 4, type: 'pg', question: "Cepat atau lambatnya sebuah gerakan tari disebut ...",
                options: ["Durasi", "Tempo", "Level", "Volume"], answer: "Tempo",
                hint: "Kecepatan gerak."
            },
            {
                id: 5, type: 'pg', question: "Seni pertunjukan drama yang dilakukan di atas panggung disebut ...",
                options: ["Seni Musik", "Seni Rupa", "Seni Teater", "Seni Lukis"], answer: "Seni Teater",
                svg: svgs.panggung,
                hint: "Ada pemain peran dan cerita."
            },
            {
                id: 6, type: 'pg', question: "Orang yang ahli dalam bidang seni disebut ...",
                options: ["Seniman", "Atlet", "Ilmuwan", "Pedagang"], answer: "Seniman",
                hint: "Pembuat karya seni."
            },
            {
                id: 7, type: 'pg', question: "Kegiatan yang dilakukan untuk melenturkan tubuh sebelum menari adalah ...",
                options: ["Makan", "Tidur", "Pemanasan", "Pendinginan"], answer: "Pemanasan",
                hint: "Agar tidak cedera."
            },
            {
                id: 8, type: 'pg', question: "Pertunjukan teater tanpa kata-kata yang mengandalkan gerak tubuh dan wajah disebut ...",
                options: ["Puisi", "Pantomim", "Pidato", "Menyanyi"], answer: "Pantomim",
                hint: "Gerakan bisu."
            },
            {
                id: 9, type: 'pg', question: "Gerak berjalan, berlari, dan melompat adalah contoh gerak ...",
                options: ["Di tempat", "Berpindah tempat", "Diam", "Lemah"], answer: "Berpindah tempat",
                hint: "Posisi tubuh berubah lokasi."
            },
            {
                id: 10, type: 'pg', question: "Gerak dengan tingkatan (level) rendah biasanya dilakukan dengan posisi ...",
                options: ["Berdiri jinjit", "Melompat", "Duduk/Jongkok", "Berlari"], answer: "Duduk/Jongkok",
                hint: "Posisi tubuh dekat dengan lantai."
            },
            {
                id: 11, type: 'pg', question: "Jika kita menirukan gerakan harimau yang sedang marah, tenaga yang digunakan adalah ...",
                options: ["Lemah", "Kuat", "Halus", "Pelan"], answer: "Kuat",
                hint: "Harimau hewan yang bertenaga."
            },
            {
                id: 12, type: 'pg', question: "Menirukan gerakan kupu-kupu terbang biasanya menggunakan gerak yang ...",
                options: ["Kuat dan kaku", "Cepat dan keras", "Lemah dan gemulai", "Menghentak"], answer: "Lemah dan gemulai",
                hint: "Gerakannya halus."
            },

            // --- BAGIAN 2: BENAR / SALAH (13-22) ---
            {
                id: 13, type: 'tf', question: "Tema tari bisa diambil dari kegiatan sehari-hari seperti berkebun.",
                options: ["Benar", "Salah"], answer: "Benar",
                hint: "Banyak tarian bertema aktivitas manusia."
            },
            {
                id: 14, type: 'tf', question: "Tempo adalah lamanya waktu tarian berlangsung.",
                options: ["Benar", "Salah"], answer: "Salah",
                hint: "Itu adalah Durasi. Tempo adalah kecepatan."
            },
            {
                id: 15, type: 'tf', question: "Pendinginan dilakukan sebelum melakukan gerakan inti.",
                options: ["Benar", "Salah"], answer: "Salah",
                hint: "Pendinginan dilakukan SETELAH gerakan inti."
            },
            {
                id: 16, type: 'tf', question: "Pantomim sangat mengandalkan ekspresi wajah dan gerak tubuh.",
                options: ["Benar", "Salah"], answer: "Benar",
                hint: "Karena tidak ada suara ucapan."
            },
            {
                id: 17, type: 'tf', question: "Ekspresi wajah sedih ditunjukkan dengan tersenyum lebar.",
                options: ["Benar", "Salah"], answer: "Salah",
                svg: svgs.wajah_sedih,
                hint: "Sedih biasanya cemberut atau menangis."
            },
            {
                id: 18, type: 'tf', question: "Tahap mencoba-coba berbagai gerakan untuk mencari gerak yang sesuai disebut Eksplorasi.",
                options: ["Benar", "Salah"], answer: "Benar",
                hint: "Mencari dan menemukan gerak."
            },
            {
                id: 19, type: 'tf', question: "Gerak tari yang kuat membutuhkan banyak tenaga.",
                options: ["Benar", "Salah"], answer: "Benar",
                hint: "Seperti menghentakkan kaki."
            },
            {
                id: 20, type: 'tf', question: "Bunyi 'Aummm' adalah contoh menirukan suara tikus.",
                options: ["Benar", "Salah"], answer: "Salah",
                hint: "Itu suara harimau/singa. Tikus suaranya 'cit-cit'."
            },
            {
                id: 21, type: 'tf', question: "Seni teater menggabungkan unsur gerak dan suara.",
                options: ["Benar", "Salah"], answer: "Benar",
                hint: "Ada akting dan dialog."
            },
            {
                id: 22, type: 'tf', question: "Gerak melompat ke depan adalah contoh gerak di tempat.",
                options: ["Benar", "Salah"], answer: "Salah",
                hint: "Melompat ke depan berarti berpindah tempat."
            },

            // --- BAGIAN 3: ISIAN SINGKAT (23-30) ---
            {
                id: 23, type: 'isian', question: "Ide dasar atau gagasan pokok dalam sebuah tarian disebut ...",
                answer: "tema", hint: "Awalan T."
            },
            {
                id: 24, type: 'isian', question: "Gerak tari yang dilakukan dengan tenaga yang besar dan otot tegang disebut gerak ...",
                answer: "kuat", hint: "Lawan dari lemah."
            },
            {
                id: 25, type: 'isian', question: "Cepat atau lambatnya sebuah gerakan tari disebut ...",
                answer: "tempo", hint: "Istilah musik/tari untuk kecepatan."
            },
            {
                id: 26, type: 'isian', question: "Pertunjukan teater yang hanya menggunakan isyarat tubuh tanpa kata-kata disebut ...",
                answer: "pantomim", hint: "Seni bisu."
            },
            {
                id: 27, type: 'isian', question: "Menirukan gerakan pohon tertiup angin sepoi-sepoi termasuk gerak ... (kuat/lemah)",
                answer: "lemah", hint: "Gerakannya pelan dan halus."
            },
            {
                id: 28, type: 'isian', question: "Ekspresi wajah saat sedang bahagia adalah ...",
                answer: "tersenyum", svg: svgs.wajah_senang, hint: "Bibir melengkung ke atas."
            },
            {
                id: 29, type: 'isian', question: "Orang yang menciptakan atau ahli dalam bidang seni disebut ...",
                answer: "seniman", hint: "Pekerja seni."
            },
            {
                id: 30, type: 'isian', question: "Sebelum melakukan latihan menari, kita harus melakukan ... agar tidak kram.",
                answer: "pemanasan", hint: "Persiapan fisik."
            },

            // --- BAGIAN 4: PILIHAN GANDA KOMPLEKS (31-35) ---
            {
                id: 31, type: 'pg_kompleks', question: "Pilih 2 contoh gerak tari yang bersifat KUAT:",
                options: ["Menghentakkan kaki", "Melambai pelan", "Bertepuk tangan keras", "Menggeleng halus"], answer: ["Menghentakkan kaki", "Bertepuk tangan keras"],
                hint: "Gerakan bertenaga."
            },
            {
                id: 32, type: 'pg_kompleks', question: "Pilih 2 tingkatan (level) dalam gerak tari:",
                options: ["Tinggi", "Cepat", "Rendah", "Lama"], answer: ["Tinggi", "Rendah"],
                hint: "Posisi tubuh (atas/bawah)."
            },
            {
                id: 33, type: 'pg_kompleks', question: "Pilih 2 hal yang dibutuhkan saat bermain Pantomim:",
                options: ["Ekspresi wajah", "Suara keras", "Gerak tubuh", "Mikrofon"], answer: ["Ekspresi wajah", "Gerak tubuh"],
                hint: "Tanpa suara."
            },
            {
                id: 34, type: 'pg_kompleks', question: "Pilih 2 suara alam:",
                options: ["Suara klakson", "Suara angin", "Suara ombak", "Suara bel sekolah"], answer: ["Suara angin", "Suara ombak"],
                hint: "Berasal dari alam."
            },
            {
                id: 35, type: 'pg_kompleks', question: "Pilih 2 gerak berpindah tempat (lokomotor):",
                options: ["Berlari", "Jalan di tempat", "Melompat ke samping", "Duduk"], answer: ["Berlari", "Melompat ke samping"],
                hint: "Posisi berdiri berubah."
            },

            // --- BAGIAN 5: URAIAN (36-40) ---
            {
                id: 36, type: 'uraian', question: "Apa perbedaan antara gerak di tempat dan gerak berpindah tempat?",
                answer: "Gerak di tempat tidak mengubah posisi berdiri/kaki, sedangkan gerak berpindah tempat membuat penari berpindah posisi.", 
                hint: "Jelaskan tentang perpindahan posisi."
            },
            {
                id: 37, type: 'uraian', question: "Sebutkan 3 tingkatan (level) dalam gerak tari!",
                answer: "Tingkat Tinggi (seperti jinjit), Tingkat Sedang (seperti berdiri biasa), Tingkat Rendah (seperti duduk/jongkok).", 
                hint: "Tinggi, Sedang, ..."
            },
            {
                id: 38, type: 'uraian', question: "Jelaskan apa yang dimaksud dengan Pantomim!",
                answer: "Pantomim adalah seni pertunjukan yang mengungkapkan cerita melalui gerakan tubuh dan ekspresi wajah tanpa menggunakan kata-kata/suara.", 
                hint: "Teater bisu."
            },
            {
                id: 39, type: 'uraian', question: "Mengapa kita perlu melakukan pemanasan sebelum menari?",
                answer: "Agar otot tubuh lentur, siap bergerak, dan mencegah terjadinya cedera/sakit.", 
                hint: "Alasan kesehatan."
            },
            {
                id: 40, type: 'uraian', question: "Sebutkan 2 contoh gerak tari yang menirukan gerakan hewan!",
                answer: "Contoh: Gerak kupu-kupu terbang (tangan dikepakkan), Gerak katak melompat (jongkok lalu loncat), Gerak burung (tangan direntangkan).", 
                hint: "Hewan apa saja."
            }
        ];

        // Render Questions
        const container = document.getElementById('questions-container');

        questions.forEach((q, index) => {
            const card = document.createElement('div');
            card.className = "quiz-card bg-white rounded-xl shadow-md p-6 border border-pink-100 relative overflow-hidden";
            
            // Badge Tipe Soal
            let typeLabel = "";
            let typeColor = "bg-gray-200 text-gray-700";
            if(q.type === 'pg') { typeLabel = "Pilihan Ganda"; typeColor = "bg-blue-100 text-blue-700"; }
            if(q.type === 'tf') { typeLabel = "Benar / Salah"; typeColor = "bg-green-100 text-green-700"; }
            if(q.type === 'isian') { typeLabel = "Isian Singkat"; typeColor = "bg-yellow-100 text-yellow-700"; }
            if(q.type === 'pg_kompleks') { typeLabel = "Pilihan Ganda Kompleks"; typeColor = "bg-purple-100 text-purple-700"; }
            if(q.type === 'uraian') { typeLabel = "Uraian"; typeColor = "bg-orange-100 text-orange-700"; }

            let svgContent = q.svg ? `<div class="flex justify-center my-4">${q.svg}</div>` : '';

            let questionHTML = `
                <div class="flex justify-between items-start mb-4">
                    <div class="flex items-center gap-2">
                        <span class="flex items-center justify-center w-8 h-8 rounded-full bg-pink-600 text-white font-bold">${index + 1}</span>
                        <span class="text-xs font-semibold px-2 py-1 rounded ${typeColor}">${typeLabel}</span>
                    </div>
                </div>
                <div class="mb-4">
                    ${svgContent}
                    <p class="text-lg text-gray-800 font-medium">${q.question}</p>
                    ${q.type === 'pg_kompleks' ? '<p class="text-xs text-purple-600 mt-1">*Pilih 2 jawaban yang benar</p>' : ''}
                </div>
            `;

            // Render Options based on Type
            let inputHTML = '';
            
            if (q.type === 'pg' || q.type === 'tf') {
                inputHTML += `<div class="space-y-3">`;
                q.options.forEach(opt => {
                    inputHTML += `
                        <label class="option-container flex items-center p-3 rounded-lg border border-gray-200 hover:border-pink-400">
                            <input type="radio" name="q${q.id}" value="${opt}" class="option-input form-radio h-5 w-5 text-pink-600 focus:ring-pink-500">
                            <span class="option-label ml-3 text-gray-700">${opt}</span>
                        </label>
                    `;
                });
                inputHTML += `</div>`;
            } 
            else if (q.type === 'pg_kompleks') {
                inputHTML += `<div class="space-y-3">`;
                q.options.forEach(opt => {
                    inputHTML += `
                        <label class="option-container flex items-center p-3 rounded-lg border border-gray-200 hover:border-pink-400">
                            <input type="checkbox" name="q${q.id}" value="${opt}" class="option-input form-checkbox h-5 w-5 text-pink-600 focus:ring-pink-500 rounded">
                            <span class="option-label ml-3 text-gray-700">${opt}</span>
                        </label>
                    `;
                });
                inputHTML += `</div>`;
            }
            else if (q.type === 'isian') {
                inputHTML += `
                    <input type="text" name="q${q.id}" placeholder="Ketik jawaban singkat..." class="w-full p-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-pink-500 focus:border-transparent bg-gray-50">
                `;
            }
            else if (q.type === 'uraian') {
                inputHTML += `
                    <textarea name="q${q.id}" rows="3" placeholder="Tulis jawaban lengkapmu di sini..." class="w-full p-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-pink-500 focus:border-transparent bg-gray-50"></textarea>
                `;
            }

            // Hint & Feedback Area (Hidden initially)
            inputHTML += `
                <div id="feedback-${q.id}" class="mt-4 hidden p-4 rounded-lg bg-gray-100 text-sm">
                    <p class="font-bold mb-1">Kunci Jawaban:</p>
                    <p class="text-pink-700 font-semibold">${Array.isArray(q.answer) ? q.answer.join(", ") : q.answer}</p>
                    <p class="text-gray-500 text-xs mt-2 italic">Hint: ${q.hint}</p>
                </div>
            `;

            card.innerHTML = questionHTML + inputHTML;
            container.appendChild(card);
        });

        // Handle Submission
        document.getElementById('quizForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            let score = 0;
            let totalObjective = 0;
            const formData = new FormData(e.target);
            const resultDetails = document.getElementById('resultDetails');
            resultDetails.innerHTML = ""; // Clear prev results

            questions.forEach(q => {
                const feedbackEl = document.getElementById(`feedback-${q.id}`);
                feedbackEl.classList.remove('hidden'); // Show answers
                
                let isCorrect = false;
                let userAnswer = "";

                // Logic Penilaian
                if (q.type === 'pg' || q.type === 'tf') {
                    totalObjective++;
                    userAnswer = formData.get(`q${q.id}`);
                    if (userAnswer === q.answer) {
                        score++;
                        isCorrect = true;
                        feedbackEl.classList.add('bg-pink-100', 'border', 'border-pink-300');
                    } else {
                        feedbackEl.classList.add('bg-red-50', 'border', 'border-red-200');
                    }
                } 
                else if (q.type === 'pg_kompleks') {
                    totalObjective++;
                    // Get all checked values
                    const checked = formData.getAll(`q${q.id}`);
                    userAnswer = checked.join(", ");
                    
                    // Simple array comparison (must match exactly)
                    // Sort both arrays to compare content
                    const sortedUser = checked.sort().toString();
                    const sortedAns = q.answer.sort().toString();
                    
                    if (sortedUser === sortedAns && checked.length > 0) {
                        score++;
                        isCorrect = true;
                        feedbackEl.classList.add('bg-pink-100', 'border', 'border-pink-300');
                    } else {
                        feedbackEl.classList.add('bg-red-50', 'border', 'border-red-200');
                    }
                }
                else if (q.type === 'isian') {
                    totalObjective++;
                    userAnswer = formData.get(`q${q.id}`)?.trim() || "";
                    if (userAnswer.toLowerCase() === q.answer.toLowerCase()) {
                        score++;
                        isCorrect = true;
                        feedbackEl.classList.add('bg-pink-100', 'border', 'border-pink-300');
                    } else {
                        feedbackEl.classList.add('bg-red-50', 'border', 'border-red-200');
                    }
                }
                else if (q.type === 'uraian') {
                    // Uraian tidak dinilai otomatis
                    userAnswer = formData.get(`q${q.id}`);
                    feedbackEl.classList.add('bg-orange-50', 'border', 'border-orange-200');
                    feedbackEl.innerHTML += `<p class='text-orange-600 font-bold mt-2'>*Cek jawabanmu dengan kunci jawaban di atas.</p>`;
                }

                // Add simple summary to modal
                if(q.type !== 'uraian') {
                    const icon = isCorrect ? "✅" : "❌";
                    const item = document.createElement('div');
                    item.innerHTML = `<span>${icon} No. ${q.id}</span>`;
                    resultDetails.appendChild(item);
                }
            });

            // Calculate Score (Scale 0-100 for objective parts)
            let finalScore = 0;
            if (totalObjective > 0) {
                finalScore = Math.round((score / totalObjective) * 100);
            }
            
            // Show Modal
            document.getElementById('finalScore').textContent = finalScore;
            document.getElementById('resultModal').classList.remove('hidden');
        });

        // Close Modal
        document.getElementById('closeModalBtn').addEventListener('click', function() {
            document.getElementById('resultModal').classList.add('hidden');
            // Scroll to top to review
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });
    </script>
</body>
</html>
